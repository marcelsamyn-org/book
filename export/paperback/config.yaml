# This is proposed back-cover copy, not manuscript text or approved sales copy.
back:
  headline: What makes life meaningful when machines can do it all?
  paragraphs:
    - AI promises to make our lives easier. It can write our words, do our work, and offer companionship whenever we need it. But what happens when the things we once struggled for become effortless?
    - In Sacred Struggle, Marcel Samyn starts with how these machines work and follows the question into learning, work, love, and creativity. Along the way, his own experience of a brain tumor gives the question a deeply personal weight.
    - If we could solve every problem, would we be happier? Or would we lose something we need?
  closing: Some things matter because they aren’t perfect.

